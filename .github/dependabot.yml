# Dependency update pull requests for this fork.  Weekly and limited, so
# they stay reviewable; nothing is merged automatically.  Version updates
# must also be enabled for the fork in GitHub: Insights > Dependency graph >
# Dependabot.

version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/core"
      - "/extension"
    schedule:
      interval: "weekly"
    assignees:
      - "ej04520yjo4"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    assignees:
      - "ej04520yjo4"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "ej04520yjo4"
    open-pull-requests-limit: 5
